:root{
  --cream:#FFF6E5;
  --navy:#15233F;
  --ink:#1E2A3A;
  --surface:#FFFDF6;
  --orange:#FF7A1A;
  --teal:#00B8A9
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  height:100%;
  overflow:hidden;
  background:var(--cream)
}

body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent
}

.font-display{
  font-family:'Baloo 2',system-ui,sans-serif
}

.no-touch{
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none
}

@keyframes pop{
  0%{
    transform:scale(.4)
  }

  60%{
    transform:scale(1.18)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes blast{
  0%{
    transform:scale(1);
    opacity:1
  }

  100%{
    transform:scale(1.45);
    opacity:0
  }
}

@keyframes floatUp{
  0%{
    transform:translate(-50%,0);
    opacity:0
  }

  15%{
    opacity:1
  }

  100%{
    transform:translate(-50%,-58px);
    opacity:0
  }
}

@keyframes comboPop{
  0%{
    transform:scale(.5) rotate(-4deg);
    opacity:0
  }

  55%{
    transform:scale(1.12) rotate(2deg);
    opacity:1
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

@keyframes pulseBoard{
  0%,100%{
    box-shadow:0 10px 28px rgba(21,35,63,.18)
  }

  50%{
    box-shadow:0 0 0 6px rgba(255,122,26,.22),0 10px 28px rgba(21,35,63,.18)
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-2deg)
  }

  75%{
    transform:rotate(2deg)
  }
}

@keyframes rise{
  from{
    transform:translateY(12px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

@keyframes flame{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.18)
  }
}

.animate-pop{
  animation:pop .28s ease
}

.animate-blast{
  animation:blast .45s ease forwards
}

.animate-float{
  animation:floatUp 1.1s ease forwards
}

.animate-combo{
  animation:comboPop .45s cubic-bezier(.2,1.6,.4,1)
}

.animate-pulse-board{
  animation:pulseBoard .6s ease
}

.animate-wiggle{
  animation:wiggle .35s ease
}

.animate-rise{
  animation:rise .25s ease
}

.animate-flame{
  animation:flame 1s ease infinite
}

.block-bevel{
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.14),0 2px 3px rgba(0,0,0,.18)
}

.block-bevel-small{

}

<script>
(function() {
  var banner = document.getElementById('jmfgames-ad-banner');
  if (!banner) return;
  var ins = banner.querySelector('ins.adsbygoogle');
  function isFilled() { return !!(ins && ins.querySelector('iframe')); }
  function showBanner() {
    if (banner.classList.contains('jmfgames-ads-live')) return;
    banner.classList.add('jmfgames-ads-live');
  }
  if (isFilled()) { showBanner(); return; }
  try {
    var obs = new MutationObserver(function() { if (isFilled()) { obs.disconnect(); showBanner(); } });
    if (ins) obs.observe(ins, { childList: true, subtree: true });
    setTimeout(function() { try { obs.disconnect(); } catch (e) {} }, 20000);
  } catch (e) {
    setTimeout(function() { if (isFilled()) showBanner(); }, 5000);
  }
})();
</script>
