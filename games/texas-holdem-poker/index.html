:root{
  --bg:#FFFDF5;
  --panel:#FFFFFF;
  --panel2:#FEF9E7;
  --text:#111111;
  --muted:#5A5A5A;
  --line:#E5E0D0;
  --gold:#FFC107;
  --gold2:#FFC107;
  --green:#2E9E5B;
  --felt:#2E9E5B;
  --felt2:#8FD6A8;
  --rail:#D9A066;
  --red:#E53935;
  --chip:#FFF3C4;
  --accent:#FFC107;
  --on-accent:#111111;
  --btn-bg:#FFC107;
  --shadow:0 14px 30px rgba(17,17,17,.12);
}

.dark{
  --bg:#000000;
  --panel:#141414;
  --panel2:#1A1A1A;
  --text:#FFFFFF;
  --muted:#BFBFBF;
  --line:#333333;
  --gold:#8A6D00;
  --gold2:#B8960A;
  --green:#0F5132;
  --felt:#07271A;
  --felt2:#0A3524;
  --rail:#1A0F08;
  --red:#7A1F1F;
  --chip:#262626;
  --accent:#B8960A;
  --on-accent:#000000;
  --btn-bg:#B8960A;
  --shadow:0 18px 34px rgba(0,0,0,.85);
}

*{
  box-sizing:border-box
}

html,body,#root{
  height:100%;
  margin:0;
  overflow-y:auto
}
html,body{background:#0a0f0d}

body{
  font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text)
}

.font-display{
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  letter-spacing:.04em
}

button{
  color:inherit
}

input[type=range]{
  accent-color:var(--gold);
  height:34px
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--gold2);
  border:2px solid #111;
  box-shadow:0 1px 4px rgba(0,0,0,.35)
}

input[type=text]{
  color:var(--text);
  background:var(--panel2)
}

@keyframes dealIn{
  0%{
    transform:translateY(-28px) rotate(-10deg) scale(.7);
    opacity:0
  }

  100%{
    transform:translateY(0) rotate(0) scale(1);
    opacity:1
  }
}

@keyframes flipIn{
  0%{
    transform:rotateY(90deg)
  }

  100%{
    transform:rotateY(0)
  }
}

@keyframes popIn{
  0%{
    transform:scale(.6);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 0 3px var(--gold2),0 0 28px 6px rgba(242,201,76,.75)
  }

  50%{
    box-shadow:0 0 0 5px var(--gold2),0 0 42px 12px rgba(242,201,76,.95)
  }
}

@keyframes floatChip{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-3px)
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-10px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(190px) rotate(340deg);
    opacity:0
  }
}

@keyframes thinkDot{
  0%,80%,100%{
    transform:scale(.7);
    opacity:.5
  }

  40%{
    transform:scale(1.2);
    opacity:1
  }
}

.deal{
  animation:dealIn .38s ease both
}

.flip{
  animation:flipIn .45s ease both;
  transform-style:preserve-3d
}

.pop{
  animation:popIn .3s ease both
}

.winner-glow{
  animation:glowPulse 1.1s ease-in-out infinite
}

.chip-float{
  animation:floatChip 1.6s ease-in-out infinite
}

.confetti{
  animation:confettiFall 1.5s ease-in infinite
}

.card-back{
  background:repeating-linear-gradient(45deg,#7a1620 0 6px,#a91f2e 6px 12px);
  border:2px solid #fff;
  box-shadow:0 3px 8px rgba(0,0,0,.35)
}

input[type=range]{
  accent-color:var(--gold)
}

.scroll-none::-webkit-scrollbar{
  display:none
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:grayscale:disabled {
  --tw-grayscale: grayscale(100%);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px) {
  .sm\:inset-\[14px\] {
    inset: 14px;
  }

  .sm\:block {
    display: block;
  }

  .sm\:h-\[34px\] {
    height: 34px;
  }

  .sm\:w-\[34px\] {
    width: 34px;
  }

  .sm\:border-\[14px\] {
    border-width: 14px;
  }

  .sm\:text-\[10px\] {
    font-size: 10px;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[12px\] {
    font-size: 12px;
  }

  .sm\:text-\[20px\] {
    font-size: 20px;
  }

  .sm\:text-\[26px\] {
    font-size: 26px;
  }
}

<script>
(function() {
  var banner = document.getElementById('jmfgames-ad-banner');
  if (!banner) return;
  var ins = banner.querySelector('ins.adsbygoogle');
  function isFilled() { return !!(ins && ins.querySelector('iframe')); }
  function showBanner() {

  }
})();
