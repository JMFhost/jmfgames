*{
  box-sizing:border-box;
}

html{
  background:var(--paper);
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
}

html,body,#root{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

@keyframes popIn{
  from{
    transform:scale(0.6);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.font-display{
  font-family:"Fraunces",Georgia,serif;
}

@keyframes drift{
  from{
    transform:translateX(-18%);
  }

  to{
    transform:translateX(28%);
  }
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

@keyframes floatBird{
  0%,100%{
    transform:translateY(0) rotate(-4deg);
  }

  50%{
    transform:translateY(-7px) rotate(3deg);
  }
}

@keyframes shimmer{
  0%{
    transform:translateX(-20%) skewX(-12deg);
  }

  100%{
    transform:translateX(130%) skewX(-12deg);
  }
}

.cloud-drift{
  animation:drift 9s ease-in-out infinite alternate;
}

.cloud-drift-slow{
  animation:drift 14s ease-in-out infinite alternate-reverse;
}

.star{
  animation:twinkle 2.4s ease-in-out infinite;
}

.bird-float{
  animation:floatBird 1.8s ease-in-out infinite;

<script>
(function() {
  var banner = document.getElementById('jmfgames-ad-banner');
  if (!banner) return;
  var ins = banner.querySelector('ins.adsbygoogle');
  function isFilled() { return !!(ins && ins.querySelector('iframe')); }
  function showBanner() {
    if (banner.classList.contains('jmfgames-ads-live')) return;
    banner.classList.add('jmfgames-ads-live');
  }
  if (isFilled()) { showBanner(); return; }
  try {
    var obs = new MutationObserver(function() { if (isFilled()) { obs.disconnect(); showBanner(); } });
    if (ins) obs.observe(ins, { childList: true, subtree: true });
    setTimeout(function() { try { obs.disconnect(); } catch (e) {} }, 20000);
  } catch (e) {
    setTimeout(function() { if (isFilled()) showBanner(); }, 5000);
  }
})();
</script>
