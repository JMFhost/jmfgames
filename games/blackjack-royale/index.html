:root{
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

[data-theme="dark"]{
  --bg:#0a0f0d;
  --felt:#0f5132;
  --felt-2:#0a3d27;
  --text:#ffffff;
  --muted:#c8d6ce;
  --accent:#f5c542;
  --panel:#1a2420;
  --panel-2:#24352e;
  --border:#3a4d44;
  --btn:#f5c542;
  --btn-text:#111111;
  --danger:#ff6b6b;
}

[data-theme="light"]{
  --bg:#f6f1e7;
  --felt:#1e7a4a;
  --felt-2:#166a3e;
  --text:#1a1a1a;
  --muted:#4d5a52;
  --accent:#b77900;
  --panel:#ffffff;
  --panel-2:#fff8e6;
  --border:#d8cfae;
  --btn:#1e7a4a;
  --btn-text:#ffffff;
  --danger:#b42318;
}

*{
  box-sizing:border-box
}

html,body,#root{
  height:100%;
  margin:0;
  overflow-y:auto
}

body{
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button{
  font-family:inherit
}

.mini-card{
  width:clamp(38px,11vw,54px);
  height:clamp(54px,15.5vw,76px);
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s;
  flex:none;
  border-radius:8px
}

.mini-card.flipped{
  transform:rotateY(180deg)
}

.card-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
  border:1px solid #cbd5cf
}

.card-front{
  background:#fff;
  color:#111;
  display:flex;
  flex-direction:column;
  padding:4px
}

.card-back{
  background:repeating-linear-gradient(45deg,#7a1020 0 7px,#a91d2f 7px 14px);
  transform:rotateY(180deg);
  display:flex;
  align-items:center;
  justify-content:center
}

.card-back::after{
  content:"♠ ♥";
  color:#ffd76a;
  font-size:14px;
  letter-spacing:1px;
  text-shadow:0 1px 2px #000
}

.card-back-static{
  transform:none
}

@keyframes holeFlip{
  0%{
    transform:rotateY(180deg)
  }

  100%{
    transform:rotateY(360deg)
  }
}

.hole-reveal{
  animation:holeFlip .6s ease both
}

@keyframes dealIn{
  0%{
    opacity:0;
    transform:translateY(-18px) scale(.7)
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

.deal{
  animation:dealIn .45s ease both
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-5px)
  }
}

.floaty{
  animation:floaty 2.2s ease-in-out infinite
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 0 2px #f5c542,0 0 18px #f5c542
  }

  50%{
    box-shadow:0 0 0 3px #fff,0 0 30px #ffd76a
  }
}

.winner-glow{
  animation:glowPulse 1.1s ease-in-out infinite
}

@keyframes thinkPulse{
  0%,100%{
    opacity:.6
  }

  50%{
    opacity:1
  }
}

.thinking{
  animation:thinkPulse 1s infinite
}

@keyframes shuffleSpin{
  0%{
    transform:rotate(-8deg)
  }

  50%{
    transform:rotate(8deg)
  }

  100%{
    transform:rotate(-8deg)
  }
}

.shuffle{
  animation:shuffleSpin .5s ease-in-out infinite
}

.chip{
  width:34px;
  height:34px;
  border-radius:9999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  border:2px dashed rgba(255,255,255,.9);
  box-shadow:0 3px 8px rgba(0,0,0,.25);
  color:#fff;
  cursor:pointer;
  font-size:12px;
  flex:none
}

@media(min-width:768px){
  .chip{
    width:40px;
    height:40px;
    font-size:13px
  }
}

.chip.selected{
  outline:3px solid var(--accent);
  outline-offset:2px;
  transform:scale(1.07)
}

.felt{
  background:radial-gradient(ellipse at 50% 28%, #2a9a62 0%, var(--felt) 46%, var(--felt-2) 100%);
  border:5px solid #c9a23a;
  box-shadow:inset 0 0 0 2px #8a6a1d, inset 0 0 55px rgba(0,0,0,.32), 0 10px 28px rgba(0,0,0,.28)
}

.log-scroll::-webkit-scrollbar{
  width:6px
}

.log-scroll::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:99px
}

input{
  color:var(--text)
}

.disabled\:bg-zinc-500:disabled {
  --tw-bg-opacity: 1;
  background-color: rgb(113 113 122 / var(--tw-bg-opacity, 1));
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:inline {
    display: inline;
  }
}

@media (min-width: 768px) {
  .md\:inline {
    display: inline;
  }

  .md\:rounded-\[50px\] {
    border-radius: 50px;
  }

  .md\:text-\[10px\] {
    font-size: 10px;
  }

  .md\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.min-h-\[100dvh\]{min-height:100dvh}

(function() {
